[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-public-data-quality-monitor"
version = "0.1.0"
description = "A reproducible quality monitor for Greek public statistics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.2,<3", "plotly>=5.24,<7"]
test = ["pytest>=8.0"]

[project.scripts]
greek-data-monitor = "greek_data_monitor.cli:main"
gdm = "greek_data_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

